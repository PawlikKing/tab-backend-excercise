services:
    postgres:
        image: postgres:16
        container_name: flowers-postgres
        environment:
            POSTGRES_USER: admin
            POSTGRES_PASSWORD: secret
            POSTGRES_DB: flowersdb
        ports:
            - '5432:5432'
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U admin']
            interval: 5s
            timeout: 5s
            retries: 5

    mysql:
        build:
            context: .
            dockerfile: Dockerfile.mysql
        container_name: flowers-mysql
        environment:
            MYSQL_USER: admin
            MYSQL_PASSWORD: secret
            MYSQL_ROOT_PASSWORD: root
            MYSQL_DATABASE: flowersdb
        ports:
            - '3306:3306'
        volumes:
            - mysql_data:/var/lib/mysql
        healthcheck:
            test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
            interval: 5s
            timeout: 5s
            retries: 5

volumes:
    postgres_data:
    mysql_data:
