services:
    postgres:
        image: postgres:16
        container_name: flowers-postgres
        environment:
            POSTGRES_USER: admin
            POSTGRES_PASSWORD: secret
            POSTGRES_DB: flowersdb
        ports:
            - '5432:5432'
        volumes:
            - postgres_data:/var/lib/postgresql/data
            - ./init-postgres.sql:/docker-entrypoint-initdb.d/init.sql
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U admin -d flowersdb']
            interval: 10s
            timeout: 10s
            retries: 10
            start_period: 40s

    mysql:
        image: mysql:8.0
        container_name: flowers-mysql
        environment:
            MYSQL_USER: admin
            MYSQL_PASSWORD: secret
            MYSQL_ROOT_PASSWORD: root
            MYSQL_DATABASE: flowersdb
        ports:
            - '3306:3306'
        volumes:
            - mysql_data:/var/lib/mysql
            - ./db.init.sql:/docker-entrypoint-initdb.d/init.sql
        healthcheck:
            test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
            interval: 10s
            timeout: 10s
            retries: 10
            start_period: 40s

volumes:
    postgres_data:
    mysql_data:
